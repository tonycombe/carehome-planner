<style>

<script>

function render(filter=""){
 const list=document.getElementById("list");
 list.innerHTML="";
 homes
 .filter(h=>JSON.stringify(h).toLowerCase().includes(filter.toLowerCase()))
 .forEach(h=>{
   const tel=h.phone.replace(/\D/g,"");
   list.innerHTML+=`
   <div class="card">
      <h2>${h.name}</h2>
      <div>${h.address}</div>
      ${h.contact?`<div class="contact">Contact: ${h.contact}</div>`:""}
      <div>☎ ${h.phone}</div>
      <div class="actions">
        <a href="tel:${tel}">Call</a>
        <a target="_blank" href="https://maps.google.com/?q=${encodeURIComponent(h.address)}">Map</a>
      </div>
   </div>`;
 });
}

window.onload=()=>render();
</script>
